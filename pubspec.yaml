name: nixin_studio_v8
description: Honest Flutter + Rust embedded-preview RAW editor prototype.
publish_to: "none"
version: 8.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  ffi: ^2.1.3
  file_picker: ^10.3.2
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image: ^4.5.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
