[package]
name = "raw-engine"
version = "8.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", features = ["jpeg", "png"] }
rawler = { version = "0.6", features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
