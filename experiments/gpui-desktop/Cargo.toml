[package]
name = "dextryx-gpui-spike"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[[bin]]
name = "dextryx-gpui-spike"
path = "src/entry.rs"

[dependencies]
dextryx-frontend-api = { path = "../../crates/dextryx-frontend-api" }
dextryx-platform = { path = "../../crates/dextryx-platform" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "fd90c0af7f021d89e511dd9a5f92d4f04ec29314" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fd90c0af7f021d89e511dd9a5f92d4f04ec29314", features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
raw-engine = { path = "../../rust" }
rfd-backend = { package = "rfd", version = "0.17.2" }

[dev-dependencies]
dextryx-core = { path = "../../crates/dextryx-core" }
