name: Format GPUI standalone source

on:
  push:
    branches:
      - agent/gpui-desktop-spike
    paths:
      - .github/workflows/format-gpui-standalone.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gpui-desktop-spike
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format standalone GPUI main.rs
        run: rustfmt --edition 2021 experiments/gpui-desktop/src/main.rs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "GPUI standalone source already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/gpui-desktop/src/main.rs
          git commit -m "chore: format GPUI standalone source"
          git push origin HEAD:agent/gpui-desktop-spike
