name: Fix import safety

on:
  push:
    branches:
      - agent/gpui-desktop-spike
    paths:
      - .github/workflows/fix-import-safety.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gpui-desktop-spike
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply fixes
        run: python3 tool/fix_import_safety.py
      - name: Format Rust
        run: |
          cargo fmt --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path crates/Cargo.toml --all
          rustfmt --edition 2021 experiments/gpui-desktop/src/main.rs
      - name: Test shared crates
        run: cargo test --manifest-path crates/Cargo.toml --all
      - name: Clippy raw engine
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -A dead_code -A clippy::not_unsafe_ptr_arg_deref -D warnings
      - name: Commit fixes and remove one-shot tooling
        run: |
          rm -f tool/fix_import_safety.py .github/workflows/fix-import-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden managed import safety"
          git push origin HEAD:agent/gpui-desktop-spike
