name: Format Rust branch

on:
  push:
    branches:
      - agent/gpui-desktop-spike
    paths:
      - .github/workflows/format-rust-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gpui-desktop-spike
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format all Rust workspaces
        run: |
          cargo fmt --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path crates/Cargo.toml --all
          cargo fmt --manifest-path experiments/gpui-desktop/Cargo.toml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Rust formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust crates experiments/gpui-desktop
          git commit -m "chore: format Rust sources"
          git push origin HEAD:agent/gpui-desktop-spike
